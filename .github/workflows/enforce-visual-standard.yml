name: Enforce RogueVerse Visual Standard

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/enforce-visual-standard.yml'
      - '.github/scripts/enforce_visuals.py'
      - '.github/scripts/hydrate_listing_art.py'
      - 'site-2026.css'
      - 'script.js'
      - 'assets/2026/editorial-fallback.svg'
      - 'assets/mythra/sentou-title.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce responsive image coverage
        run: python .github/scripts/enforce_visuals.py
      - name: Hydrate article listing cards
        run: python .github/scripts/hydrate_listing_art.py
      - name: Commit visual-standard sweep
        run: |
          if git diff --quiet; then
            echo "No visual-standard changes needed."
            exit 0
          fi
          git config user.name "RogueVerse Visual Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Complete responsive RogueVerse image coverage"
          git push
