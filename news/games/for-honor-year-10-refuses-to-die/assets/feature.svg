<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">For Honor Year 10: The Battle Continues</title>
<desc id="d">Original RogueVerse Media 1600 by 900 game-inspired anime action artwork with generic knight, samurai and Viking archetypes on a split fire-and-ice battlefield.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset=".46" stop-color="#17110d"/><stop offset=".55" stop-color="#081423"/><stop offset="1" stop-color="#02050a"/></linearGradient>
  <radialGradient id="fire"><stop stop-color="#ffb14a"/><stop offset=".45" stop-color="#ff5b13"/><stop offset="1" stop-color="#7b1400" stop-opacity="0"/></radialGradient>
  <radialGradient id="ice"><stop stop-color="#bde8ff"/><stop offset=".42" stop-color="#2c9dff"/><stop offset="1" stop-color="#083b73" stop-opacity="0"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9eef3"/><stop offset=".28" stop-color="#8997a7"/><stop offset=".62" stop-color="#303945"/><stop offset="1" stop-color="#0e131b"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff0a1"/><stop offset=".45" stop-color="#f2b338"/><stop offset="1" stop-color="#d26012"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
