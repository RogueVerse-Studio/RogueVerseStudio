<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read original RogueVerse Mythra manga and comic previews.">
  <title>Mythra Reader | RogueVerse Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../site-2026.css?v=20260820-visual">
</head>
<body class="reader-body">
<header class="reader-header">
  <a href="./">← Mythra Shelf</a>
  <strong id="reader-title">ROGUEVERSE STUDIO: MYTHRA — ISSUE 1</strong>
  <div class="reader-controls" aria-label="Reader size controls">
    <button id="zoom-out" type="button" aria-label="Make pages smaller">−</button>
    <button id="zoom-in" type="button" aria-label="Make pages larger">+</button>
  </div>
</header>

<section id="reader-intro" class="reader-intro" hidden></section>
<main id="reader" class="reader" aria-label="Comic pages"></main>
<section id="reader-footer" class="reader-afterword" hidden></section>

<script>
const assetRoot="../assets/mythra/married-in-a-new-world/scroll-01/";
const seriesData={
  sentou:{title:"SENTOU",label:"ISSUE 1"},
  "love-power":{title:"LOVE × POWER",label:"ISSUE 1"},
  "bounty-world":{title:"STRANDED IN A BOUNTY HUNTER WORLD",label:"ISSUE 1"},
  "married-in-a-new-world":{
    title:"MARRIED IN A NEW WORLD",
    label:"SCROLL 1 PREVIEW",
    description:"Anna and Jerald begin the next chapter of their life together—until one impossible moment changes the road ahead.",
    rating:"married-in-a-new-world-yma-rating-card.png",
    footer:"married-in-a-new-world-scroll-01-footer-coming-soon.jpg",
    pages:[
      ["married-in-a-new-world-scroll-01-preview-01-home-and-family.jpg","Home, family, and Anna leaving home"],
      ["married-in-a-new-world-scroll-01-preview-02-retirement-and-packing.jpg","Jerald's retirement and departure from the office"],
      ["married-in-a-new-world-scroll-01-preview-03-bakery-and-flowers.jpg","Anna at the bakery as Jerald buys flowers"],
      ["married-in-a-new-world-scroll-01-preview-04-crossroads-establishing.jpg","The crossroads"],
      ["married-in-a-new-world-scroll-01-preview-05-crossroads-approach.jpg","Jerald and Anna approach the crossing"],
      ["married-in-a-new-world-scroll-01-preview-07-reunion-bow.jpg","Jerald and Anna reunite"],
      ["married-in-a-new-world-scroll-01-preview-08-anna-sees-the-truck.jpg","Anna sees the danger"],
      ["married-in-a-new-world-scroll-01-preview-09-jerald-realizes.jpg","Jerald realizes what is happening"],
      ["married-in-a-new-world-scroll-01-preview-10-im-sorry-my-love.jpg","I'm sorry, my love"],
      ["married-in-a-new-world-scroll-01-preview-11-not-without-me.jpg","Not without me"],
      ["married-in-a-new-world-scroll-01-preview-12-heart-transition.jpg","A heart marks the transition to what comes next"]
    ]
  }
};

const params=new URLSearchParams(location.search);
const series=params.get("series")||"sentou";
const issue=params.get("issue")||"1";
const data=seriesData[series]||{title:"ROGUEVERSE STUDIO: MYTHRA",label:`ISSUE ${issue}`};
const reader=document.querySelector("#reader");
const intro=document.querySelector("#reader-intro");
const afterword=document.querySelector("#reader-footer");

document.title=`${data.title} — ${data.label} | RogueVerse Mythra`;
document.querySelector("#reader-title").textContent=`${data.title} — ${data.label}`;

if(data.pages){
  intro.hidden=false;
  intro.innerHTML=`
    <div class="reader-intro__copy">
      <p class="eyebrow">RogueVerse Mythra Original</p>
      <h1>${data.title}</h1>
      <p class="reader-kicker">${data.label}</p>
      <p>${data.description}</p>
    </div>
    <figure class="reader-rating">
      <img src="${assetRoot+data.rating}" alt="YMA rating information for Married in a New World" width="941" height="1672">
      <figcaption>Young Mythra Audience rating information</figcaption>
    </figure>`;

  reader.innerHTML=data.pages.map(([file,alt],index)=>`
    <figure class="manga-page manga-page--art" data-page="${String(index+1).padStart(2,"0")}">
      <img src="${assetRoot+file}" alt="${alt}" width="1033" height="1536" ${index===0?'fetchpriority="high"':'loading="lazy"'} decoding="async">
      <figcaption class="sr-only">Preview page ${index+1} of ${data.pages.length}: ${alt}</figcaption>
    </figure>`).join("");

  afterword.hidden=false;
  afterword.innerHTML=`
    <p class="reader-afterword__label">After the preview</p>
    <img src="${assetRoot+data.footer}" alt="Married in a New World — coming soon" width="1033" height="1536" loading="lazy" decoding="async">`;
}else{
  reader.innerHTML=["01","02","03"].map(page=>`
    <article class="manga-page" data-page="${page}"><span class="page-number">${page}</span></article>`).join("");
}

let width=1050;
document.querySelector("#zoom-in").onclick=()=>{width=Math.min(1500,width+100);reader.style.maxWidth=`${width}px`;};
document.querySelector("#zoom-out").onclick=()=>{width=Math.max(500,width-100);reader.style.maxWidth=`${width}px`;};
</script>
</body>
</html>
