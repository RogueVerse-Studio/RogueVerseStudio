<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Shinobi and mounted warlord at a burning castle gate</title><desc id="d">Original RogueVerse editorial illustration inspired by feudal Japanese action anime, with a lone shinobi facing a mounted warrior beneath an ash-filled orange sky.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111317"/><stop offset=".48" stop-color="#30231f"/><stop offset="1" stop-color="#a84319"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#222"/><stop offset="1" stop-color="#060708"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ffd29a"/><stop offset=".5" stop-color="#f06a21"/><stop offset="1" stop-color="#9b2c15"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
 <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="1" fill="#fff" opacity=".05"/><circle cx="9" cy="7" r="1" fill="#000" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1235" cy="210" r="150" fill="url(#sun)" opacity=".82"/><circle cx="1235" cy="210" r="210" fill="#ef5c1d" opacity=".18" filter="url(#glow)"/>
<path d="M0 510 L150 430 270 455 430 390 560 432 690 365 840 420 960 350 1110 405 1260 335 1415 405 1600 355V900H0Z" fill="#101114" opacity=".82"/>
