<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Demon Slayer: Infinity Castle tops Crunchyroll after a $793 million theatrical run</title>
  <desc id="desc">RogueVerse News editorial header using Demon Slayer Infinity Castle promotional character artwork with a bold news overlay.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03060c" stop-opacity=".97"/>
      <stop offset=".48" stop-color="#03060c" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#03060c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#03060c" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#050914"/>
  <image href="https://images.justwatch.com/backdrop/333384494/s640/demon-slayer-kimetsu-no-yaiba-infinity-castle.jpg" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="900" fill="url(#shade)"/>
  <rect width="1600" height="900" fill="url(#bottom)"/>

  <g transform="translate(74 68)" filter="url(#shadow)">
    <circle cx="72" cy="72" r="69" fill="#07101d" stroke="#188ee8" stroke-width="8"/>
    <path d="M18 66c28-44 83-58 124-27" fill="none" stroke="#ff681f" stroke-width="10" stroke-linecap="round"/>
    <text x="72" y="61" text-anchor="middle" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="29" font-weight="900">ROGUEVERSE</text>
    <text x="72" y="97" text-anchor="middle" fill="#ff681f" font-family="Arial Black,Arial,sans-serif" font-size="38" font-weight="900">NEWS</text>
  </g>

  <g transform="translate(72 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="54" rx="5" fill="#ff681f"/>
    <text x="22" y="38" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900">ANIME NEWS</text>

    <text x="0" y="132" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="76" font-weight="900">DEMON SLAYER:</text>
    <text x="0" y="211" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="76" font-weight="900">INFINITY CASTLE</text>
    <text x="0" y="292" fill="#ff681f" font-family="Arial Black,Arial,sans-serif" font-size="66" font-weight="900">TOPS CRUNCHYROLL</text>
    <text x="0" y="362" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="52" font-weight="900">AFTER $793M GLOBAL RUN</text>

    <rect x="0" y="402" width="665" height="7" fill="#168ee8"/>
    <text x="0" y="448" fill="#dce9ff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">The blockbuster enters its second life on streaming.</text>
  </g>

  <g transform="translate(72 806)">
    <rect width="1456" height="54" rx="6" fill="#05070c" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="22" y="34" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">EDITORIAL IMAGE • Demon Slayer: Kimetsu no Yaiba © Koyoharu Gotoge / SHUEISHA, Aniplex, ufotable and applicable rights holders.</text>
  </g>
</svg>